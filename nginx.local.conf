events {}

http {
    #-------------------------------------------------------------
    # 1) 개발 환경용 (localhost)
    #-------------------------------------------------------------
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # /api → Nest 서버
        location /api/ {
            proxy_pass http://host.docker.internal:3001; # 변경
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 그 외 → Next 프론트
        location / {
            proxy_pass http://host.docker.internal:3000; # 변경
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }
}
}